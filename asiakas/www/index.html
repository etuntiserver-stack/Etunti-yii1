<!DOCTYPE html>
<html>
  <head>
        <meta charset="utf-8" />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-tap-highlight" content="no" />
        <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, height=device-height" />


        <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="css/index.css" />

        <script type="text/javascript" src="js/jquery-1.11.2.min.js"></script>
  	<script src="js/bootstrap.min.js"></script>

  <body>



<div class="container-fluid">

  <div class="row" id="header">
   <div class="col-sm-12">
      <div class="pull-right">
	    <div id="asiakas"></div>
	    <div id="server" style="display:none"></div>
	    <div style="display:none" id="versioBlock">Versio: <span id="version" class="small"></span></div> 
      </div>
      <img src="img/logo-black.png" class="logo">
   </div>
  </div>

    <div id="yllaIlmoitus"></div>

    <!-- Login container -->
    <div class="container-fluid" id="loginLomake" style="display:none">
     <div class="col-sm-4 col-sm-offset-4">
      <form action="#" class="form-signin" id="form-signin" method="POST" autocomplete='off'>
        <label>Yritystunnus</label>
        <input type="text" name="domain" id="domain" class="form-control input-lg" required autofocus />

        <label>Sähköposti</label>
        <input type="email" id="inputEmail" name="tunnus" class="form-control input-lg" required autocomplete="off" />

        <label>Salasana</label>
        <input type="password" id="inputPassword" name="salasana" class="form-control input-lg" required autocomplete="off" />
	<br>
        <button class="btn btn-lg btn-primary btn-block" type="submit">Kirjaudu sisään</button>
      </form>
     </div>
    </div> 
    <!-- Login container -->

    <!-- Kirjautuminen jalkeen -->
    <div class="container-fluid" id="laatikot" style="display:none">

     <div class="row">
      <div class="col-sm-6">
       <button id="minunVinkit" class="btn btn-lg btn-block">Minun vinkit</button>
      </div>
      <div class="col-sm-6">
       <button id="toteutuneetTunnit" class="btn btn-lg btn-block">Toteutuneet työt</button>
      </div>
     </div>
     <br>
     <div class="row">
      <div class="col-sm-6">
       <button id="palautteenAntaminen" class="btn btn-lg btn-block">Palautteen antaminen</button>
      </div>
      <div class="col-sm-6">
       <button id="tyovuorot" class="btn btn-lg btn-block">Työvuorot</button>
      </div>
     </div>

    </div> 
    <!-- Kirjautuminen jalkeen -->



  <div id="footlinks"></div>
