<!DOCTYPE html>
<html>
  <head>
    <title>InAppBrowser.addEventListener Example</title>

    <link rel="stylesheet" type="text/css" href="index.css">
    <script type="text/javascript" src="js/jquery-1.11.2.min.js"></script>
    <script type="text/javascript" charset="utf-8" src="cordova.js"></script>
    <script type="text/javascript" charset="utf-8">

    // Wait for device API libraries to load
    //
    document.addEventListener("deviceready", onDeviceReady, false);

    // device APIs are available
    //
    function onDeviceReady() {
         var ref = window.open('http://etunti.fi/index.php/asiakkaat/login', '_blank', 'location=no');
         ref.addEventListener('loadstart', function(event) { /*alert('start: ' + event.url);*/ });
         ref.addEventListener('loaderror', function(event) { alert('error: ' + event.message); });
         ref.addEventListener('exit', function(event) { /*alert(event.type);*/ });

         ref.addEventListener('loadstop', function(event) { 
	
		ref.executeScript({ code: " " +

		" $('#sovelluksenFooter').css({'display':'clock'}); " +
		" $('#sidebar_left, .navbar-branding').css({'display':'none'}); " +
		" $('#content_wrapper').css({'margin':'0'}); "

		});

	 });

    }



    </script>
  </head>
  <body>
  </body>
</html>
